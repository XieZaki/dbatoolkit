<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root { color-scheme: light; --ink:#202936; --muted:#596579; --line:#d7dee8; --paper:#fff; --bg:#eef2f6; --blue:#164f86; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI",Arial,sans-serif; }
    main { max-width:1320px; margin:24px auto; padding:0 22px 40px; }
    header, section, nav { background:var(--paper); border:1px solid var(--line); border-radius:6px; }
    header { padding:26px 30px; }
    h1 { margin:0 0 18px; font-size:27px; }
    h2 { margin:0; font-size:21px; }
    h3 { margin:18px 0 8px; font-size:16px; }
    nav { margin:16px 0; padding:16px 20px; display:flex; flex-wrap:wrap; gap:8px 18px; }
    nav a { color:var(--blue); text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    section { margin:14px 0; padding:20px 24px; scroll-margin-top:12px; }
    .meta,.fields { display:grid; grid-template-columns:minmax(170px,230px) 1fr; gap:5px 16px; margin:0; }
    dt { color:var(--muted); font-weight:600; } dd { margin:0; overflow-wrap:anywhere; }
    .summary-metrics { display:flex; flex-wrap:wrap; gap:8px 22px; margin:4px 0 18px; }
    .summary-metric { min-width:150px; }
    .summary-metric strong { display:block; color:var(--muted); font-size:12px; }
    .badge { display:inline-block; border-radius:4px; padding:2px 7px; background:#e8eef5; font-size:12px; font-weight:700; }
    .badge.CRITICAL { background:#f9d8d8; color:#851d1d; } .badge.HIGH { background:#ffe2c2; color:#793800; }
    .badge.WARNING { background:#fff0bf; color:#674d00; } .badge.HEALTHY { background:#d9f1df; color:#155b2c; }
    table { width:100%; border-collapse:collapse; margin:12px 0; font-size:13px; }
    th,td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
    th { background:#eaf0f6; position:sticky; top:0; }
    .table-wrap { max-width:100%; overflow-x:auto; }
    pre { margin:8px 0; padding:14px; background:#f3f5f8; border:1px solid var(--line); border-radius:5px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:none; }
    code,pre { font-family:Consolas,"Courier New",monospace; }
    details { margin:12px 0; border:1px solid var(--line); border-radius:5px; padding:8px 12px; }
    summary { cursor:pointer; color:var(--blue); font-weight:600; }
    @media print { body { background:#fff; } main { max-width:none; margin:0; padding:0; } nav { display:none; }
      header,section { break-inside:avoid; border-radius:0; box-shadow:none; } th { position:static; }
      .table-wrap { overflow:visible; } table { font-size:10pt; } a { color:inherit; text-decoration:none; } }
    @media (max-width:650px) { main { margin:10px auto; padding:0 8px 20px; } header,section { padding:16px; }
      .meta,.fields { grid-template-columns:1fr; gap:0; } dd { margin-bottom:8px; } }
  </style>
</head>
<body>
  {{BODY}}
</body>
</html>
