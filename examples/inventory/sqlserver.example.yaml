databases:
  - id: example-sqlserver
    name: Example SQL Server
    db_type: sqlserver
    version_family: "2022"
    host: 192.0.2.10
    port: 1433
    database: master
    credential_alias: example-only-sqlserver-monitor
    enabled: false
    environment: example
    connection:
      encrypt: true
      trust_server_certificate: false
      connect_timeout: 5
      query_timeout: 10
