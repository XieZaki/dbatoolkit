name: Build Windows Full and Update packages

on:
  push:
    branches: [main, codex/release-v0.9.1-recovery]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Must match both pyproject.toml and dba.__version__'
        required: false
        type: string
      publish_release:
        description: 'Publish an existing matching tag after its build and asset checks succeed'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Existing vX.Y.Z tag to publish when dispatching from main'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare x64 build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
          architecture: x64

      - name: Check tag and source package versions
        id: version
        shell: pwsh
        run: |
          $projectVersion = [regex]::Match((Get-Content pyproject.toml -Raw), '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          $sourceVersion = [regex]::Match((Get-Content dba/__init__.py -Raw), '(?m)^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $projectVersion -or $projectVersion -ne $sourceVersion) { throw 'Project package version sources disagree.' }
          $releaseTag = ''
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $releaseTag = $env:GITHUB_REF_NAME
            $tagVersion = $releaseTag -replace '^v', ''
            if ($tagVersion -ne $projectVersion) { throw 'Release tag does not match the project package version.' }
          }
          $recoveryPush = $env:GITHUB_EVENT_NAME -eq 'push' -and
              $env:GITHUB_REF -eq 'refs/heads/codex/release-v0.9.1-recovery'
          $manualRecovery = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
              '${{ inputs.publish_release }}' -eq 'true' -and $env:GITHUB_REF -notlike 'refs/tags/*'
          if ($recoveryPush -or $manualRecovery) {
            if ($recoveryPush) {
              $releaseTag = "v$projectVersion"
            } else {
              if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Manual Release dispatch is allowed only from main.' }
              $releaseTag = '${{ inputs.release_tag }}'
              if ($releaseTag -ne "v$projectVersion") { throw 'Manual Release tag does not match the project package version.' }
            }
            $tagRef = "refs/tags/$releaseTag"
            $tagRefSpec = "${tagRef}:${tagRef}"
            git fetch --no-tags origin $tagRefSpec
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the requested existing Release tag.' }
            $tagCommit = git rev-parse "$releaseTag^{commit}"
            if ($LASTEXITCODE -ne 0 -or -not $tagCommit) { throw 'Requested Release tag does not resolve to a commit.' }
            git diff --quiet $tagCommit $env:GITHUB_SHA -- . `
              ':!.github/workflows/build-portable-windows.yml' `
              ':!deployment/build_release.ps1' `
              ':!deployment/windows/release_package.py' `
              ':!tests/test_portable_update.py'
            if ($LASTEXITCODE -ne 0) { throw 'Manual Release source differs from the tagged source outside this workflow file.' }
          }
          $requested = '${{ inputs.version }}'
          if ($requested -and $requested -ne $projectVersion) { throw 'Requested build version does not match the project version.' }
          "version=$projectVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Install test and quality tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not install project test tools.' }

      - name: Run Windows test suite
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or -not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) {
            throw 'GitHub Actions RUNNER_TEMP is unavailable.'
          }
          $pytestTemp = Join-Path $env:RUNNER_TEMP 'dbatoolkit-pytest'
          $processTemp = Join-Path $env:RUNNER_TEMP 'dbatoolkit-process-temp'
          New-Item -ItemType Directory -Path $pytestTemp -Force | Out-Null
          New-Item -ItemType Directory -Path $processTemp -Force | Out-Null
          $pytestTemp = (Resolve-Path -LiteralPath $pytestTemp).Path
          $processTemp = (Resolve-Path -LiteralPath $processTemp).Path
          if (-not (Test-Path -LiteralPath $pytestTemp -PathType Container) -or -not (Test-Path -LiteralPath $processTemp -PathType Container)) {
            throw 'Could not prepare Windows pytest temporary directories.'
          }
          $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Write-Host "Windows runner current-user SID: $runnerSid"
          foreach ($entry in @(
            @{ label = 'Pytest basetemp'; path = $pytestTemp },
            @{ label = 'Process TEMP/TMP'; path = $processTemp }
          )) {
            $acl = Get-Acl -LiteralPath $entry.path
            $ownerSid = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            $trusteeSids = @($acl.Access | ForEach-Object {
              try { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value }
              catch { [string]$_.IdentityReference }
            } | Sort-Object -Unique)
            Write-Host "$($entry.label) owner SID: $ownerSid"
            Write-Host "$($entry.label) DACL trustee SIDs: $($trusteeSids -join ', ')"
          }
          $env:TEMP = $processTemp
          $env:TMP = $processTemp
          Write-Host "Pytest basetemp: $pytestTemp"
          Write-Host "Process TEMP/TMP: $processTemp"
          python -m pytest -q --basetemp="$pytestTemp"
          if ($LASTEXITCODE -ne 0) { throw 'Windows pytest failed.' }
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed.' }
          python -m mypy dba
          if ($LASTEXITCODE -ne 0) { throw 'Strict MyPy failed.' }

      - name: Prepare hash-locked offline wheelhouse
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/portable-build-inputs/wheelhouse -Force | Out-Null
          $locks = @('base.lock', 'mysql.lock', 'postgresql.lock', 'oracle.lock', 'sqlserver.lock')
          foreach ($lock in $locks) {
            python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: `
              --dest dist/portable-build-inputs/wheelhouse --require-hashes `
              --platform win_amd64 --python-version 3.13 --implementation cp --abi cp313 `
              --requirement (Join-Path 'deployment/locks/windows-cp313-x64' $lock)
            if ($LASTEXITCODE -ne 0) { throw "Could not prepare the locked wheelhouse for $lock." }
          }

      - name: Obtain pinned CPython embeddable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'dist/portable-build-inputs/python-3.13.17-embed-amd64.zip'
          New-Item -ItemType Directory -Path (Split-Path -Parent $runtime) -Force | Out-Null
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip' -OutFile $runtime -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw 'Pinned CPython runtime download did not create the expected file.' }
          $hash = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9e35319bffedab8b36ad44d8f377cb4f1733bcec257a0b6d04d94f01486ddb38') { throw 'Pinned CPython runtime hash mismatch.' }

      - name: Build and validate Full, Update and checksums
        shell: pwsh
        run: |
          .\deployment\build_release.ps1 -Version '${{ steps.version.outputs.version }}' `
            -PythonEmbedZip 'dist/portable-build-inputs/python-3.13.17-embed-amd64.zip' `
            -Wheelhouse 'dist/portable-build-inputs/wheelhouse' `
            -BuildPython (Get-Command python).Source `
            -BuildId '${{ github.sha }}' `
            -OutputDirectory 'dist/release'

      - name: Upload Full and Update candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DBAToolkit-${{ steps.version.outputs.version }}-Windows-x64-release-candidate
          path: |
            dist/release/DBAToolkit-${{ steps.version.outputs.version }}-Windows-x64-Full.zip
            dist/release/DBAToolkit-${{ steps.version.outputs.version }}-Windows-x64-Update.zip
            dist/release/DBAToolkit-${{ steps.version.outputs.version }}-SHA256SUMS.txt
            dist/release/DBAToolkit-${{ steps.version.outputs.version }}-User-Guide.md
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/release-v0.9.1-recovery' && needs.build.outputs.release_tag != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && needs.build.outputs.release_tag != '')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: DBAToolkit-${{ needs.build.outputs.version }}-Windows-x64-release-candidate
          path: release-assets

      - name: Remove stale malformed asset from the failed v0.9.1 draft
        if: github.ref == 'refs/heads/codex/release-v0.9.1-recovery'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = '${{ needs.build.outputs.release_tag }}'
          $version = '${{ needs.build.outputs.version }}'
          $fullName = "DBAToolkit-$version-Windows-x64-Full.zip"
          $updateName = "DBAToolkit-$version-Windows-x64-Update.zip"
          $sumsName = "DBAToolkit-$version-SHA256SUMS.txt"
          $expectedStaleAssets = @($fullName, $updateName, $sumsName, 'default.md')
          $releaseJson = gh release view $tag --repo $repo --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the existing failed v0.9.1 draft.' }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Refusing to alter a published Release.' }
          $assetNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $sortedExpected = @($expectedStaleAssets | Sort-Object)
          if ($assetNames.Count -ne 4 -or (Compare-Object $sortedExpected $assetNames)) {
            throw 'Existing draft assets do not match the known failed v0.9.1 upload; refusing automatic cleanup.'
          }
          gh release delete-asset $tag 'default.md' --yes --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the malformed manual asset from the failed draft.' }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-assets/DBAToolkit-${{ needs.build.outputs.version }}-Windows-x64-Full.zip
            release-assets/DBAToolkit-${{ needs.build.outputs.version }}-Windows-x64-Update.zip
            release-assets/DBAToolkit-${{ needs.build.outputs.version }}-SHA256SUMS.txt
            release-assets/DBAToolkit-${{ needs.build.outputs.version }}-User-Guide.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify uploaded assets before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $version = '${{ needs.build.outputs.version }}'
          $tag = '${{ needs.build.outputs.release_tag }}'
          $fullName = "DBAToolkit-$version-Windows-x64-Full.zip"
          $updateName = "DBAToolkit-$version-Windows-x64-Update.zip"
          $sumsName = "DBAToolkit-$version-SHA256SUMS.txt"
          $manualName = "DBAToolkit-$version-User-Guide.md"
          $expectedAssets = @($fullName, $updateName, $sumsName, $manualName)

          $releaseJson = gh release view $tag --repo $repo --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the draft Release.' }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Release must remain a draft until asset verification completes.' }
          $assetNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $sortedExpected = @($expectedAssets | Sort-Object)
          if ($assetNames.Count -ne 4 -or (Compare-Object $sortedExpected $assetNames)) {
            throw 'Draft Release does not contain exactly the four expected assets.'
          }

          $sourceSums = Join-Path $env:GITHUB_WORKSPACE (Join-Path 'release-assets' $sumsName)
          if (-not (Test-Path -LiteralPath $sourceSums -PathType Leaf)) { throw 'Local SHA256SUMS asset is missing.' }
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath $sourceSums) {
            $match = [regex]::Match($line, '^(?<hash>[a-fA-F0-9]{64})\s+\*?(?<name>.+)$')
            if (-not $match.Success) { throw 'SHA256SUMS contains an invalid entry.' }
            $checksums[$match.Groups['name'].Value] = $match.Groups['hash'].Value.ToLowerInvariant()
          }
          if ($checksums.Count -ne 3 -or -not $checksums.ContainsKey($fullName) -or
              -not $checksums.ContainsKey($updateName) -or -not $checksums.ContainsKey($manualName)) {
            throw 'SHA256SUMS must cover exactly Full, Update, and the Chinese manual.'
          }

          $verifyDirectory = Join-Path $env:RUNNER_TEMP 'dbatoolkit-release-asset-check'
          New-Item -ItemType Directory -Path $verifyDirectory -Force | Out-Null
          gh release download $tag --repo $repo --dir $verifyDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the uploaded Release assets for verification.' }
          foreach ($name in $expectedAssets) {
            $downloaded = Join-Path $verifyDirectory $name
            if (-not (Test-Path -LiteralPath $downloaded -PathType Leaf)) { throw "Release asset is missing: $name" }
            $remoteAsset = $release.assets | Where-Object { $_.name -ceq $name }
            if ($null -eq $remoteAsset -or (Get-Item -LiteralPath $downloaded).Length -ne $remoteAsset.size) {
              throw "Downloaded Release asset size differs from the uploaded asset: $name"
            }
            if ($name -eq $sumsName) {
              $localHash = (Get-FileHash -LiteralPath $sourceSums -Algorithm SHA256).Hash.ToLowerInvariant()
            } else {
              $localHash = $checksums[$name]
            }
            $downloadHash = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($downloadHash -ne $localHash) { throw "Release asset SHA256 verification failed: $name" }
          }

          gh release edit $tag --repo $repo --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Verified Release could not be published.' }
